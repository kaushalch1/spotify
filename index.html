<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spokify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <h1>Spokify</h1>
    <button class="buttons" title="join room" id="roombtn"></button>
    <div class="popup-container">
        <div id="mypopup" class="popup-box">
            <h4 id="room-id">Room Id:</h4>
            <input type="text" style="width: 150px;" placeholder="  Enter the room id:" id="room_id" title="room id"></input>
            <button id="join">Join</button>
            <p id="user_num">Users Online:</p>
            <p id="users"></p>
        </div>
    </div>
    <p>Play music with your friends and enjoy ad free music</p>
    <div id="search-box">
        <i class="fa fa-search search-icon" aria-hidden="true" style="padding-right: 15px;"></i>
        <input type="search" id="search" placeholder="Search songs.."></input>
        <div id="options"></div>
    </div>
    <div id="home-cont">
        <section class="quick-picks" aria-label="quick-picks">
            <div class="section-head">
                <h3 id="quick-picks-title">Quick picks</h3>
                <span>Tap to search</span>
            </div>
            <div class="pick-list">
                <button class="pick" data-query="lofi beats">Lofi beats</button>
                <button class="pick" data-query="top pop hits">Top pop hits</button>
                <button class="pick" data-query="chill music">Chill music</button>
                <button class="pick" data-query="workout music">Workout music</button>
            </div>
        </section>
        <section class="steps" aria-label="How to use spokify">
            <div><strong>01</strong><span>Search<br>for music</span></div>
            <div><strong>02</strong><span>Join<br>a room</span></div>
            <div><strong>03</strong><span>Listen<br>together</span></div>
        </section>
    </div>
    <div id="results" aria-live="polite"></div>
    <div id="player" style="padding-top: 50%;"></div>
    <!--<audio controls autoplay style="width: 100%"> </audio>-->
    <script src="socket.io.min.js"></script>
    <script type="module" src="./index.js"></script>
</body>
</html>
